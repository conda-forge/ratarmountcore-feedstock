{% set name = "ratarmountcore" %}
{% set version = "0.10.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/ratarmountcore-{{ version }}.tar.gz
  sha256: 259644bc057b844ba6f73edd9923118757e0933f2ea6c54d841e2f897f2a5f5f

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - wheel
    - setuptools >=61,<=82
  run:
    - python >={{ python_min }}
  run_constrained:
    - indexed_gzip >=1.6.3,<2
    - indexed_zstd >=1.3.1,<2
    - rapidgzip >=0.15,<0.16
    - py7zr >=1.0,<2
    - python-libarchive-c >=5.1,<6
    - python-xz >=0.4,<0.5
    # rarfile 4.1+ has not been released to conda-forge yet!
    - rarfile >=4,<5

test:
  imports:
    - ratarmountcore
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/mxmlnkn/ratarmount/tree/master/core
  summary: Random Access Read-Only Tar Mount Library
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ap--
    - mxmlnkn
